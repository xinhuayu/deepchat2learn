<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">Source digestion and academic conversation flow</title>
  <desc id="desc">Source files are ingested, extracted, chunked, digested with the selected review skill, and then used by the academic conversation skill. Live turns retrieve relevant evidence and bounded recent context without rebuilding the full research review.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2a5f93"/></marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5f7890"/></marker>
    <style>
      .node { fill:#eaf2fb; stroke:#2a5f93; stroke-width:2; }
      .external { fill:#f6f9fc; stroke:#5f7890; stroke-width:2; }
      .line { stroke:#2a5f93; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .optionalLine { stroke:#5f7890; stroke-width:2.2; fill:none; stroke-dasharray:7 5; marker-end:url(#arrowMuted); }
      .label { font:600 17px Arial, sans-serif; fill:#163d69; text-anchor:middle; }
      .sub { font:14px Arial, sans-serif; fill:#263746; text-anchor:middle; }
      .note { font:13px Arial, sans-serif; fill:#405466; text-anchor:middle; }
    </style>
  </defs>
  <rect width="1200" height="1180" fill="white"/>

  <!-- Ingestion and digestion path -->
  <path class="line" d="M600 105 V150"/>
  <path class="line" d="M600 245 V290"/>
  <path class="line" d="M600 385 V430"/>
  <path class="line" d="M600 525 V570"/>
  <path class="line" d="M600 665 V710"/>
  <path class="line" d="M600 805 V850"/>
  <path class="line" d="M600 945 V990"/>
  <path class="optionalLine" d="M450 195 C250 225 250 515 450 475"/>
  <path class="optionalLine" d="M750 475 C950 515 950 225 750 195"/>
  <text class="note" x="285" y="355">Python extractor when configured</text>
  <text class="note" x="915" y="355">Node fallback if Python unavailable</text>

  <!-- Live-turn retrieval loop: bounded context returns to conversation, not digestion -->
  <path class="optionalLine" d="M750 1030 C1080 1030 1080 897 750 897"/>
  <text class="note" x="965" y="900">retrieve relevant chunks and recent context</text>

  <g><rect class="node" x="400" y="20" width="400" height="85" rx="12"/><text class="label" x="600" y="53">Source supplied</text><text class="sub" x="600" y="78">paper, notes, or document</text></g>
  <g><rect class="node" x="400" y="150" width="400" height="95" rx="12"/><text class="label" x="600" y="183">ingestSource</text><text class="sub" x="600" y="208">validate files, bytes, pages, and words</text></g>
  <g><rect class="node" x="400" y="290" width="400" height="95" rx="12"/><text class="label" x="600" y="323">Extract material</text><text class="sub" x="600" y="348">text, pages, tables, captions, figures</text></g>
  <g><rect class="node" x="400" y="430" width="400" height="95" rx="12"/><text class="label" x="600" y="463">chunkSource</text><text class="sub" x="600" y="488">page-aware chunks and retrieval index</text></g>
  <g><rect class="node" x="400" y="570" width="400" height="95" rx="12"/><text class="label" x="600" y="603">Per-source digest</text><text class="sub" x="600" y="628">digestSource with active review skill</text></g>
  <g><rect class="node" x="400" y="710" width="400" height="95" rx="12"/><text class="label" x="600" y="743">Consolidated digest</text><text class="sub" x="600" y="768">buildConsolidatedDigest on digest request</text></g>
  <g><rect class="node" x="400" y="850" width="400" height="95" rx="12"/><text class="label" x="600" y="883">Academic conversation</text><text class="sub" x="600" y="908">academic-conversation skill; short live turn</text></g>
  <g><rect class="node" x="400" y="990" width="400" height="95" rx="12"/><text class="label" x="600" y="1023">One live turn</text><text class="sub" x="600" y="1048">current question, answer, agenda stage</text></g>

  <text class="note" x="600" y="1120">Research-review skills shape digestion; the live dialogue does not rerun the full review for every turn.</text>
</svg>
