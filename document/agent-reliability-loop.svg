<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI agent reliability improvement loop</title>
  <desc id="desc">A failure is observed, documented with evidence, reproduced, isolated to a boundary, fixed, converted into a regression test, monitored in the next build, and reviewed by a human.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2a5f93"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c9822d"/></marker>
    <style>
      .bg { fill:#ffffff; }
      .lane { fill:#fbfdff; stroke:#d6e3ef; stroke-width:2; }
      .node { fill:#eaf2fb; stroke:#2a5f93; stroke-width:2; }
      .human { fill:#fff5e8; stroke:#c9822d; stroke-width:2; }
      .result { fill:#dceefa; stroke:#174f80; stroke-width:3; }
      .line { stroke:#2a5f93; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .humanLine { stroke:#c9822d; stroke-width:3; fill:none; stroke-dasharray:10 8; marker-end:url(#arrowAmber); }
      .kicker { font:600 16px Arial, sans-serif; fill:#2a5f93; }
      .label { font:600 20px Arial, sans-serif; fill:#163d69; text-anchor:middle; }
      .sub { font:16px Arial, sans-serif; fill:#263746; text-anchor:middle; }
      .small { font:14px Arial, sans-serif; fill:#405466; text-anchor:middle; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect class="lane" x="40" y="40" width="1520" height="540" rx="24"/>
  <text class="kicker" x="70" y="80">RELIABILITY IMPROVEMENT LOOP</text>
  <text class="label" x="800" y="125">Turn every meaningful failure into a safer next release</text>

  <path class="line" d="M280 270 H340"/>
  <path class="line" d="M570 270 H630"/>
  <path class="line" d="M860 270 H920"/>
  <path class="line" d="M1150 270 H1210"/>
  <path class="line" d="M1360 340 V440"/>
  <path class="line" d="M1210 500 H1150"/>
  <path class="line" d="M920 500 H860"/>
  <path class="line" d="M630 500 H570"/>
  <path class="line" d="M340 500 H280"/>
  <path class="line" d="M150 440 V340"/>

  <g><rect class="node" x="60" y="215" width="220" height="110" rx="16"/><text class="label" x="170" y="260">1. Observe</text><text class="sub" x="170" y="290">user-visible failure</text></g>
  <g><rect class="node" x="340" y="215" width="230" height="110" rx="16"/><text class="label" x="455" y="260">2. Record evidence</text><text class="sub" x="455" y="290">steps, logs, error</text></g>
  <g><rect class="node" x="630" y="215" width="230" height="110" rx="16"/><text class="label" x="745" y="260">3. Reproduce</text><text class="sub" x="745" y="290">smallest failing case</text></g>
  <g><rect class="human" x="920" y="215" width="230" height="110" rx="16"/><text class="label" x="1035" y="260">4. Isolate boundary</text><text class="sub" x="1035" y="290">UI, state, model, data</text></g>
  <g><rect class="node" x="1210" y="215" width="300" height="145" rx="16"/><text class="label" x="1360" y="260">5. Fix minimally</text><text class="sub" x="1360" y="290">preserve contracts</text><text class="sub" x="1360" y="320">avoid unrelated refactors</text></g>

  <g><rect class="result" x="1210" y="440" width="300" height="110" rx="16"/><text class="label" x="1360" y="485">6. Add regression test</text><text class="sub" x="1360" y="515">function and visible state</text></g>
  <g><rect class="result" x="920" y="440" width="230" height="110" rx="16"/><text class="label" x="1035" y="485">7. Verify</text><text class="sub" x="1035" y="515">full suite and real path</text></g>
  <g><rect class="result" x="630" y="440" width="230" height="110" rx="16"/><text class="label" x="745" y="485">8. Update docs</text><text class="sub" x="745" y="515">summary, diagram, limits</text></g>
  <g><rect class="result" x="340" y="440" width="230" height="110" rx="16"/><text class="label" x="455" y="485">9. Monitor</text><text class="sub" x="455" y="515">latency, retries, drift</text></g>
  <g><rect class="result" x="60" y="440" width="220" height="110" rx="16"/><text class="label" x="170" y="485">10. Reassess</text><text class="sub" x="170" y="515">release or continue</text></g>

  <rect class="lane" x="190" y="655" width="1220" height="150" rx="20"/>
  <text class="kicker" x="220" y="695">HUMAN CHECKPOINTS</text>
  <text class="sub" x="800" y="735">meaning and educational value  |  privacy and safety  |  release readiness</text>
  <text class="small" x="800" y="770">Dashed arrows indicate judgment that should not be delegated to the model alone.</text>
  <path class="humanLine" d="M1035 325 C1035 620 800 620 800 655"/>
</svg>
