<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI agentic tool architecture</title>
  <desc id="desc">A central session orchestrator connects user interfaces to models, tools, knowledge, memory, and human oversight. All actions pass through bounded context and explicit contracts.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2a5f93"/></marker>
    <style>
      .bg { fill:#ffffff; }
      .zone { fill:#fbfdff; stroke:#d6e3ef; stroke-width:2; }
      .node { fill:#eaf2fb; stroke:#2a5f93; stroke-width:2; }
      .hub { fill:#dceefa; stroke:#174f80; stroke-width:4; }
      .external { fill:#f6f9fc; stroke:#5f7890; stroke-width:2; }
      .human { fill:#fff5e8; stroke:#c9822d; stroke-width:2; }
      .line { stroke:#2a5f93; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .kicker { font:600 16px Arial, sans-serif; fill:#2a5f93; }
      .label { font:600 22px Arial, sans-serif; fill:#163d69; text-anchor:middle; }
      .sub { font:16px Arial, sans-serif; fill:#263746; text-anchor:middle; }
      .small { font:14px Arial, sans-serif; fill:#405466; text-anchor:middle; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect class="zone" x="30" y="35" width="1540" height="210" rx="22"/>
  <rect class="zone" x="30" y="275" width="1540" height="365" rx="22"/>
  <rect class="zone" x="30" y="670" width="1540" height="180" rx="22"/>
  <text class="kicker" x="60" y="75">INTERACTION LAYER</text>
  <text class="kicker" x="60" y="315">AGENT CONTROL LAYER</text>
  <text class="kicker" x="60" y="710">KNOWLEDGE, OPERATIONS, AND OVERSIGHT</text>

  <path class="line" d="M380 160 H600"/>
  <path class="line" d="M1000 160 H1220"/>
  <g><rect class="node" x="95" y="105" width="285" height="110" rx="16"/><text class="label" x="237" y="150">User</text><text class="sub" x="237" y="180">voice, text, files</text></g>
  <g><rect class="node" x="600" y="105" width="400" height="110" rx="16"/><text class="label" x="800" y="150">Browser interface</text><text class="sub" x="800" y="180">permissions, status, transcript</text></g>
  <g><rect class="external" x="1220" y="105" width="285" height="110" rx="16"/><text class="label" x="1362" y="150">API boundary</text><text class="sub" x="1362" y="180">auth, limits, transport</text></g>

  <path class="line" d="M800 215 V350"/>
  <path class="line" d="M610 430 H420"/>
  <path class="line" d="M990 430 H1180"/>
  <path class="line" d="M800 515 V585"/>
  <g><rect class="hub" x="600" y="350" width="400" height="165" rx="18"/><text class="label" x="800" y="400">Session orchestrator</text><text class="sub" x="800" y="435">state, turn-taking, context</text><text class="sub" x="800" y="465">tool choice, cancellation, budgets</text><text class="sub" x="800" y="495">normalized contracts</text></g>
  <g><rect class="node" x="95" y="365" width="325" height="130" rx="16"/><text class="label" x="257" y="410">Conversation policy</text><text class="sub" x="257" y="440">academic skill, intent</text><text class="sub" x="257" y="470">response style, next step</text></g>
  <g><rect class="node" x="1180" y="365" width="325" height="130" rx="16"/><text class="label" x="1342" y="410">Provider gateway</text><text class="sub" x="1342" y="440">text, audio, fallback</text><text class="sub" x="1342" y="470">timeouts, retries, schemas</text></g>
  <g><rect class="external" x="620" y="585" width="360" height="75" rx="14"/><text class="label" x="800" y="620">Bounded context builder</text><text class="sub" x="800" y="645">digest + retrieval + recent turns</text></g>

  <path class="line" d="M440 760 H600"/>
  <path class="line" d="M1000 760 H1160"/>
  <g><rect class="node" x="95" y="730" width="345" height="90" rx="14"/><text class="label" x="267" y="770">Source knowledge</text><text class="sub" x="267" y="798">PDF, DOCX, chunks, evidence</text></g>
  <g><rect class="node" x="600" y="730" width="400" height="90" rx="14"/><text class="node" x="0" y="0" opacity="0"/><text class="label" x="800" y="770">Session state</text><text class="sub" x="800" y="798">history, drafts, recordings, audit</text></g>
  <g><rect class="human" x="1160" y="730" width="345" height="90" rx="14"/><text class="label" x="1332" y="770">Human oversight</text><text class="sub" x="1332" y="798">meaning, safety, release</text></g>
</svg>
