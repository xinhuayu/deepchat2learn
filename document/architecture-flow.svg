<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">deepchat2learn hub architecture</title>
  <desc id="desc">The conversation orchestrator is the central hub. It coordinates the learner, browser, Node API, source knowledge, session state, text reasoning, and OpenAI Realtime audio paths. Only the Python PDF helper is optional.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2a5f93"/></marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5f7890"/></marker>
    <style>
      .lane { fill:#fbfdff; stroke:#d6e3ef; stroke-width:1.5; }
      .node { fill:#eaf2fb; stroke:#2a5f93; stroke-width:2; }
      .hub { fill:#dceefa; stroke:#174f80; stroke-width:3; }
      .external { fill:#f6f9fc; stroke:#5f7890; stroke-width:2; }
      .line { stroke:#2a5f93; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .optionalLine { stroke:#5f7890; stroke-width:2.2; fill:none; stroke-dasharray:7 5; marker-end:url(#arrowMuted); }
      .label { font:600 16px Arial, sans-serif; fill:#163d69; text-anchor:middle; }
      .sub { font:13px Arial, sans-serif; fill:#263746; text-anchor:middle; }
      .edge { font:13px Arial, sans-serif; fill:#405466; text-anchor:middle; }
      .edgeBack { fill:white; stroke:#d6e3ef; stroke-width:1; }
      .laneTitle { font:600 15px Arial, sans-serif; fill:#163d69; }
      .legend { font:12px Arial, sans-serif; fill:#405466; }
    </style>
  </defs>
  <rect width="1700" height="900" fill="white"/>

  <rect class="lane" x="15" y="35" width="1670" height="315" rx="18"/>
  <rect class="lane" x="15" y="380" width="1670" height="255" rx="18"/>
  <rect class="lane" x="15" y="665" width="1670" height="210" rx="18"/>
  <text class="laneTitle" x="35" y="65">CORE REQUEST AND CONVERSATION FLOW</text>
  <text class="laneTitle" x="35" y="402">SOURCE PROCESSING AND SESSION STATE</text>
  <text class="laneTitle" x="35" y="695">OPTIONAL SERVICES</text>

  <!-- The main control path is centered on the conversation orchestrator. -->
  <path class="line" d="M145 180 H165"/>
  <path class="line" d="M395 180 H440"/>
  <path class="line" d="M670 180 H715"/>
  <g><rect class="edgeBack" x="112" y="74" width="86" height="22" rx="6"/><text class="edge" x="155" y="89">voice / text</text></g>
  <g><rect class="edgeBack" x="374" y="74" width="84" height="22" rx="6"/><text class="edge" x="416" y="89">HTTP API</text></g>
  <g><rect class="edgeBack" x="650" y="74" width="84" height="22" rx="6"/><text class="edge" x="692" y="89">turn routing</text></g>

  <g><rect class="node" x="15" y="125" width="130" height="110" rx="12"/><text class="label" x="80" y="160">Learner</text><text class="sub" x="80" y="184">voice or text</text><text class="sub" x="80" y="206">source files</text></g>
  <g><rect class="node" x="165" y="105" width="230" height="150" rx="12"/><text class="label" x="280" y="140">Browser UI</text><text class="sub" x="280" y="164">public/app.js</text><text class="sub" x="280" y="186">voice state and transcript</text><text class="sub" x="280" y="208">recording and history</text><text class="sub" x="280" y="230">SpeechRecognition/Synthesis</text></g>
  <g><rect class="node" x="440" y="105" width="230" height="150" rx="12"/><text class="label" x="555" y="140">Node HTTP API</text><text class="sub" x="555" y="164">src/server.mjs</text><text class="sub" x="555" y="186">routes and security</text><text class="sub" x="555" y="208">limits and health</text><text class="sub" x="555" y="230">session authorization</text></g>
  <g><rect class="hub" x="715" y="105" width="270" height="150" rx="12"/><text class="label" x="850" y="140">Conversation orchestrator</text><text class="sub" x="850" y="164">shared state and routing</text><text class="sub" x="850" y="186">budgets and idempotency</text><text class="sub" x="850" y="208">voice and source policy</text><text class="sub" x="850" y="230">turn contracts</text></g>
  <text class="edge" x="850" y="96">CENTRAL HUB</text>

  <!-- Parallel provider paths: text reasoning and Realtime audio are both core. -->
  <path class="line" d="M985 155 H1030"/>
  <path class="line" d="M1280 155 H1325"/>
  <path class="line" d="M985 205 C1005 205 1005 285 1030 285"/>
  <path class="line" d="M1280 285 H1325"/>
  <g><rect class="node" x="1030" y="90" width="250" height="130" rx="12"/><text class="label" x="1155" y="125">Text coach + gateway</text><text class="sub" x="1155" y="149">modelCoach prompts</text><text class="sub" x="1155" y="171">schemas and fallback</text><text class="sub" x="1155" y="193">timeouts and retries</text></g>
  <g><rect class="external" x="1325" y="90" width="270" height="130" rx="12"/><text class="label" x="1460" y="125">OpenAI text model</text><text class="sub" x="1460" y="149">Responses API</text><text class="sub" x="1460" y="171">questions and answers</text><text class="sub" x="1460" y="193">evaluation and digest</text></g>
  <g><rect class="node" x="1030" y="245" width="250" height="80" rx="12"/><text class="label" x="1155" y="277">Realtime session path</text><text class="sub" x="1155" y="300">audio setup and events</text></g>
  <g><rect class="external" x="1325" y="245" width="270" height="80" rx="12"/><text class="label" x="1460" y="277">OpenAI Realtime</text><text class="sub" x="1460" y="300">WebRTC audio, VAD, speech</text></g>
  <g><rect class="edgeBack" x="995" y="74" width="105" height="22" rx="6"/><text class="edge" x="1047" y="89">text task + schema</text></g>
  <g><rect class="edgeBack" x="1285" y="74" width="82" height="22" rx="6"/><text class="edge" x="1326" y="89">provider request</text></g>
  <g><rect class="edgeBack" x="975" y="225" width="112" height="22" rx="6"/><text class="edge" x="1031" y="240">audio control path</text></g>
  <g><rect class="edgeBack" x="1278" y="225" width="112" height="22" rx="6"/><text class="edge" x="1334" y="240">audio + events</text></g>

  <!-- Source knowledge and session state are aligned beneath the orchestrator. -->
  <path class="line" d="M555 255 V440"/>
  <path class="line" d="M670 505 H715"/>
  <path class="line" d="M820 255 V440"/>
  <path class="line" d="M890 440 V255"/>
  <path class="line" d="M940 255 C1000 305 1000 365 1070 440"/>
  <path class="line" d="M1110 440 C1060 380 1030 320 985 235"/>
  <g><rect class="edgeBack" x="565" y="355" width="120" height="22" rx="6"/><text class="edge" x="625" y="370">upload and validate</text></g>
  <g><rect class="edgeBack" x="647" y="414" width="90" height="22" rx="6"/><text class="edge" x="692" y="429">chunk and index</text></g>
  <g><rect class="edgeBack" x="800" y="355" width="125" height="22" rx="6"/><text class="edge" x="862" y="370">retrieve / return</text></g>
  <g><rect class="edgeBack" x="1015" y="382" width="125" height="22" rx="6"/><text class="edge" x="1077" y="397">persist state</text></g>
  <g><rect class="edgeBack" x="980" y="330" width="100" height="22" rx="6"/><text class="edge" x="1030" y="345">load state</text></g>

  <g><rect class="node" x="440" y="440" width="230" height="130" rx="12"/><text class="label" x="555" y="475">Source ingestion</text><text class="sub" x="555" y="499">ingestSource</text><text class="sub" x="555" y="521">PDF, DOCX, text, notes</text><text class="sub" x="555" y="543">validation and extraction</text></g>
  <g><rect class="node" x="715" y="440" width="270" height="130" rx="12"/><text class="label" x="850" y="475">Source knowledge</text><text class="sub" x="850" y="499">chunkSource and retrieval</text><text class="sub" x="850" y="521">digest status and citations</text><text class="sub" x="850" y="543">evidence support checks</text></g>
  <g><rect class="node" x="1030" y="440" width="250" height="130" rx="12"/><text class="label" x="1155" y="475">Session store</text><text class="sub" x="1155" y="499">memory by default</text><text class="sub" x="1155" y="521">SQLite optional</text><text class="sub" x="1155" y="543">session-scoped history</text></g>

  <!-- Optional services: dashed arrows are limited to the Python PDF helper. -->
  <path class="optionalLine" d="M515 570 V735"/>
  <path class="optionalLine" d="M595 735 V570"/>
  <g><rect class="edgeBack" x="488" y="680" width="135" height="22" rx="6"/><text class="edge" x="555" y="695">optional Python/pdfplumber</text></g>
  <g><rect class="external" x="440" y="735" width="230" height="100" rx="12"/><text class="label" x="555" y="770">Python PDF helper</text><text class="sub" x="555" y="794">optional pdfplumber</text><text class="sub" x="555" y="816">richer tables and pages</text></g>

  <line x1="1110" y1="820" x2="1160" y2="820" class="line"/><text class="legend" x="1170" y="824">core data or audio path</text>
  <line x1="1390" y1="820" x2="1440" y2="820" class="optionalLine"/><text class="legend" x="1450" y="824">optional helper</text>
</svg>
